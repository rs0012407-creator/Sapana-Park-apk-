name: Build Sapana Park CHS Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Project Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Install & Configure Capacitor CLI
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Sapana Park App" "com.sapanapark.society" --web-dir dist

      - name: Add Android Platform & Sync Assets
        run: |
          npx cap add android
          npx cap sync android

      - name: Build Android Debug APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Generated APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SapanaPark-CHS-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
